worker_processes 1;

events { worker_connections 1024; }

http {
  # The five NestJS services run on the host (via `pnpm dev`), not in containers.
  # `host.docker.internal` is wired by the compose `extra_hosts` directive,
  # so nginx (inside its container) can reach the host network.
  upstream catalog_upstream { server host.docker.internal:3001; }
  upstream order_upstream   { server host.docker.internal:3002; }
  upstream query_upstream   { server host.docker.internal:3003; }

  # Standard proxy headers shared by every location.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  server {
    listen 8080;
    server_name _;

    # REST → catalog-service
    location /products      { proxy_pass http://catalog_upstream; }
    location ~ ^/products/  { proxy_pass http://catalog_upstream; }

    # REST → order-service
    location /orders        { proxy_pass http://order_upstream; }
    location ~ ^/orders/    { proxy_pass http://order_upstream; }

    # GraphQL → query-service (both POST and the embedded Apollo sandbox GET)
    location /graphql       { proxy_pass http://query_upstream; }

    # Tiny landing page so hitting `/` doesn't 404.
    location = / {
      default_type text/plain;
      return 200 "tp-microservices gateway\n\nRoutes:\n  /products    (REST  → catalog-service)\n  /orders      (REST  → order-service)\n  /graphql     (GraphQL → query-service)\n";
    }
  }
}
